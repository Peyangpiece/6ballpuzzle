function logo(admin=false){return `<div class="logo"><span class="mark"></span><span>Live Gate${admin?'<small style="display:block;font-size:9px;letter-spacing:.08em;color:#8c91a4;margin-top:-3px">ADMIN</small>':''}</span></div>`}
function userHeader(){return `<header class="user-header">${logo()}<div class="user-actions"><button class="btn btn-soft" onclick="go('/tickets')">マイチケット</button><button class="icon-btn" aria-label="お知らせ">${icons.bell}</button></div></header>`}
function bottomNav(active='home'){return `<nav class="bottom-nav"><button class="bottom-link ${active==='home'?'active':''}" onclick="go('/')"><b style="font-size:22px">${icons.home}</b>ホーム</button><button class="bottom-link ${active==='ticket'?'active':''}" onclick="go('/tickets')"><b style="font-size:21px">${icons.ticket}</b>チケット</button></nav>`}
function userFooter(){return `<footer class="user-footer"><div class="footer-inner"><div>${logo()}<p class="footer-note">チケットの購入から管理、入場まで。ライブ体験を、もっとスマートに。</p></div><div><b>サービス</b><div class="footer-links"><a href="#/">イベントを探す</a><a href="#/tickets">マイチケット</a><a href="#/admin">主催者向け管理画面</a></div></div><div><b>サポート</b><div class="footer-links"><span>利用規約</span><span>プライバシーポリシー</span><span>特定商取引法に基づく表記</span><span>お問い合わせ</span></div></div></div></footer>`}
function eventCard(name='SUMMER LIVE 2026',date='9.12 SAT',venue='DIAMOND HALL',price='¥3,500〜',status='販売中'){return `<article class="event-card" onclick="go('/event/summer-live-2026')"><div class="event-art"><span class="chip chip-live">${status}</span></div><div class="event-body"><div class="event-title">${name}</div><div class="meta">${icons.calendar} ${date} ・ OPEN 17:30 / START 18:00</div><div class="meta">${icons.pin} ${venue}</div><div class="price-row"><span class="price">${price}</span><span class="small-link">詳細を見る →</span></div></div></article>`}
function home(){return `<div class="user-shell">${userHeader()}<main class="user-main"><section class="hero"><div class="hero-content"><span class="eyebrow" style="color:#ff8aad">LIVE GATE</span><h1>ライブへ、<br>最短で。</h1><p>チケット購入から入場まで、スマホひとつ。迷わない、待たない、シンプルなライブ体験を。</p><div class="hero-cta"><button class="btn btn-primary" onclick="document.querySelector('#events').scrollIntoView()">イベントを探す</button><button class="btn btn-soft" onclick="go('/tickets')">マイチケットを見る</button></div></div></section><section class="section" id="events"><div class="section-head"><div><span class="eyebrow">DISCOVER</span><h2>受付中の公演</h2><div class="section-sub">今すぐ購入できるライブ・イベント</div></div><div class="filters"><button class="filter active">すべて</button><button class="filter">販売中</button><button class="filter">販売前</button><button class="filter">終了</button></div></div><div class="event-grid">${eventCard()}${eventCard('ROCK SPECIAL NIGHT','9.20 SUN','STUDIO Z','¥3,000〜','残りわずか')}${eventCard('Acoustic Night','10.4 SUN','BLUE NOTE ROOM','¥4,000〜','販売中')}</div></section><section class="section"><div class="section-head"><div><span class="eyebrow">WHY LIVE GATE</span><h2>購入から入場まで、ひとつ。</h2></div></div><div class="event-grid"><div class="panel"><b>01　すぐ見つかる</b><p class="section-sub">日時・会場・価格・販売状態を、一覧で迷わず確認。</p></div><div class="panel"><b>02　すぐ買える</b><p class="section-sub">必要な入力を絞り、購入完了までをシンプルに。</p></div><div class="panel"><b>03　すぐ入れる</b><p class="section-sub">購入後のQRチケットをワンタップで表示。</p></div></div></section></main>${userFooter()}${bottomNav('home')}</div>`}
function detail(){return `<div class="user-shell">${userHeader()}<main class="user-main"><div class="event-detail"><button class="btn btn-soft" style="margin-bottom:16px" onclick="go('/')">← イベント一覧</button><div class="detail-hero"><span class="chip chip-live">販売中</span></div><section class="detail-card"><span class="eyebrow">LIVE</span><h1>SUMMER LIVE 2026</h1><p class="desc">Echoes / Night Traveler / LUMINA</p><div class="detail-meta"><div class="info-tile"><b>${icons.calendar} 2026年9月12日（土）</b><span>OPEN 17:30 / START 18:00</span></div><div class="info-tile"><b>${icons.pin} DIAMOND HALL</b><span>愛知県名古屋市</span></div><div class="info-tile"><b>販売期間</b><span>9月11日 23:59まで</span></div></div><h2 style="font-size:20px;margin-top:28px">イベントについて</h2><p class="desc">今夜の夏を最高に熱くする一夜限りのライブ。ライブハウスならではの距離感と臨場感を楽しめます。</p><h2 style="font-size:20px;margin-top:28px">チケットを選ぶ</h2><div class="ticket-list"><div class="ticket-option selected" onclick="selectTicket(this,'一般チケット',3500)"><div><h3>一般チケット</h3><p>スタンディング / 整理番号付き　・　残り32枚</p></div><div><div class="price">¥3,500</div><small class="chip chip-green">販売中</small></div></div><div class="ticket-option" onclick="selectTicket(this,'前方エリア',5500)"><div><h3>前方エリア</h3><p>前方優先エリア / 整理番号付き　・　残りわずか</p></div><div><div class="price">¥5,500</div><small class="chip chip-orange">残りわずか</small></div></div></div></section><div class="sticky-purchase"><div class="sum"><small>選択中</small><b id="ticketChoice">一般チケット · ¥3,500</b></div><button class="btn btn-primary" onclick="go('/checkout')">チケットを購入</button></div></div></main>${userFooter()}${bottomNav('home')}</div>`}
function selectTicket(el,name,price){document.querySelectorAll('.ticket-option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');state.ticketType=name;state.ticketPrice=price;document.querySelector('#ticketChoice').textContent=`${name} · ${money(price)}`}
function checkout(){const total=state.ticketPrice*state.qty+state.fee;return `<div class="user-shell">${userHeader()}<main class="user-main"><div class="checkout-wrap"><section class="panel"><div class="stepper"><span class="step"><i>1</i>選択</span><span class="step-line"></span><span class="step active"><i>2</i>確認・決済</span><span class="step-line"></span><span class="step"><i>3</i>完了</span></div><h2>購入者情報</h2><div class="field"><label>お名前</label><input value="山田 太郎" /></div><div class="field"><label>メールアドレス</label><input value="taro@example.com" /></div><h2 style="margin-top:26px">お支払い方法</h2><div class="field"><label>カード番号</label><input value="4242 4242 4242 4242" /></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>有効期限</label><input value="12/29" /></div><div class="field"><label>セキュリティコード</label><input value="123" /></div></div><div class="trust">🔒 この画面はブラッシュアップ版のUIプロトタイプです。実決済は行われません。</div></section><aside class="panel"><h2>注文内容の最終確認</h2><div style="display:flex;gap:12px;align-items:center;padding-bottom:15px;border-bottom:1px solid var(--line)"><div class="thumb" style="width:76px;height:52px"></div><div><b>SUMMER LIVE 2026</b><div class="section-sub">9月12日（土）18:00</div></div></div><div class="summary-line"><span>${state.ticketType}</span><span class="qty"><button onclick="changeQty(-1)">−</button><b id="qty">${state.qty}枚</b><button onclick="changeQty(1)">＋</button></span></div><div class="summary-line"><span>チケット料金</span><span id="ticketSubtotal">${money(state.ticketPrice*state.qty)}</span></div><div class="summary-line"><span>システム利用料</span><span>${money(state.fee)}</span></div><div class="summary-line total"><span>合計金額</span><b id="total">${money(total)}</b></div><p class="section-sub">購入後のキャンセルは主催者規定に従います。確定前に内容をご確認ください。</p><button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="purchase()"><span id="payText">${money(total)}を支払って購入する</span></button><button class="btn btn-soft" style="width:100%;margin-top:8px" onclick="go('/event/summer-live-2026')">内容を修正する</button></aside></div></main>${bottomNav('home')}</div>`}
function changeQty(d){state.qty=Math.min(4,Math.max(1,state.qty+d));const total=state.ticketPrice*state.qty+state.fee;document.querySelector('#qty').textContent=state.qty+'枚';document.querySelector('#ticketSubtotal').textContent=money(state.ticketPrice*state.qty);document.querySelector('#total').textContent=money(total);document.querySelector('#payText').textContent=money(total)+'を支払って購入する'}
function purchase(){localStorage.setItem('livegate-demo-ticket','yes');toast('購入が完了しました');setTimeout(()=>go('/tickets'),500)}
function qrHtml(){let arr=[];for(let y=0;y<21;y++)for(let x=0;x<21;x++){let finder=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);let ring=finder&&((x%14===0)||(y%14===0)||(x%14===6)||(y%14===6));let center=finder&&(x%14>=2&&x%14<=4&&y%14>=2&&y%14<=4);let on=ring||center||((x*17+y*31+x*y*3)%7<3&&!finder);arr.push(`<span class="${on?'on':''}"></span>`)}return arr.join('')}
function tickets(){return `<div class="user-shell">${userHeader()}<main class="user-main"><div class="ticket-page"><span class="eyebrow">MY TICKETS</span><h1 style="font-size:32px;letter-spacing:-.04em;margin:5px 0 18px">マイチケット</h1><div class="tabs"><span class="tab active">すべて</span><span class="tab">開催前</span><span class="tab">開催中</span><span class="tab">終了</span></div><article class="my-ticket"><div class="ticket-cover"><div class="countdown">あと17日</div><h2>SUMMER LIVE 2026</h2><div style="font-size:12px;color:#d9d7e6">2026年9月12日（土）18:00 · DIAMOND HALL</div></div><div class="ticket-body"><div class="chip chip-live">一般チケット</div><div class="ticket-code"><div class="serial"><small>整理番号</small><strong>A-042</strong><small>2枚</small></div><div class="qr">${qrHtml()}</div></div><p style="text-align:center;color:var(--pink);font-size:13px;font-weight:900">🔒 入場時にスタッフへこの画面を提示してください</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px"><button class="btn btn-soft" onclick="toast('画面の明るさを上げてください')">☀ 画面を明るくする</button><button class="btn btn-soft" onclick="toast('会場情報を表示しました')">${icons.pin} 会場を確認</button></div></div></article></div></main>${userFooter()}${bottomNav('ticket')}</div>`}
function adminSide(active='dashboard'){const links=[['dashboard','ダッシュボード','▦','/admin'],['events','イベント管理','◫','/admin/events'],['orders','注文・売上','≡','/admin/orders'],['checkin','入場管理','⌗','/admin/checkin'],['users','参加者','●','#'],['analytics','分析','⌁','#']];return `<aside class="admin-side" id="adminSide">${logo(true)}<nav class="admin-nav">${links.map(x=>`<a class="admin-link ${active===x[0]?'active':''}" href="${x[3]==='#'?'javascript:toast(\'この画面は次フェーズで実装予定\')':'#'+x[3]}"><span style="width:18px;text-align:center">${x[2]}</span>${x[1]}</a>`).join('')}</nav><div class="admin-spacer"></div><nav class="admin-nav"><a class="admin-link" href="#/">↗ 公開サイトを見る</a><a class="admin-link" href="javascript:toast('設定画面は次フェーズで実装予定')">⚙ 設定</a></nav><div class="admin-profile"><div class="avatar">LG</div><div><b style="font-size:12px">Live Gate Admin</b><small>オーナー</small></div></div></aside>`}
function adminTop(title){return `<header class="admin-top"><div style="display:flex;align-items:center;gap:10px"><button class="icon-btn mobile-menu-btn" onclick="document.querySelector('#adminSide').classList.toggle('open')">☰</button><h1>${title}</h1></div><div class="admin-tools"><button class="btn btn-soft" style="min-height:40px">2026/08/26</button><button class="icon-btn">${icons.bell}</button><button class="btn btn-dark" style="min-height:40px" onclick="openCreateEvent()">＋ イベント作成</button></div></header>`}

const orders=[['#LG-12345','山田 太郎','SUMMER LIVE 2026','2枚','¥7,440','支払済み','paid'],['#LG-12344','佐藤 花子','ROCK SPECIAL NIGHT','1枚','¥3,000','支払済み','paid'],['#LG-12343','鈴木 一郎','Acoustic Night','1枚','¥4,000','支払い待ち','pending'],['#LG-12342','田中 美咲','SUMMER LIVE 2026','2枚','¥7,440','返金済み','refund'],['#LG-12341','伊藤 翼','ROCK SPECIAL NIGHT','1枚','¥3,000','支払済み','paid']];
function orderTable(limit=5){return `<div class="table-wrap"><table class="table"><thead><tr><th>注文ID</th><th>購入者</th><th>イベント</th><th>枚数</th><th>金額</th><th>ステータス</th><th></th></tr></thead><tbody>${orders.slice(0,limit).map(o=>`<tr><td><b>${o[0]}</b></td><td>${o[1]}</td><td>${o[2]}</td><td>${o[3]}</td><td>${o[4]}</td><td><span class="status ${o[6]}">${o[5]}</span></td><td><button class="table-actions" onclick="toast('${o[0]} の詳細を開きました')">•••</button></td></tr>`).join('')}</tbody></table></div>`}
function adminDashboard(){return `<div class="admin-shell">${adminSide('dashboard')}<div class="admin-main">${adminTop('ダッシュボード')}<main class="admin-content"><section class="admin-banner"><div><h2>SUMMER LIVE 2026 は販売中です</h2><p>開催まで17日。販売率82%、現在328枚を販売済みです。</p></div><button class="btn btn-primary" onclick="go('/admin/checkin')">当日受付を確認</button></section><div class="kpi-grid"><div class="kpi"><label>売上</label><strong>¥1,234,567</strong><span class="delta">↑ 12.5% 前月比</span></div><div class="kpi"><label>注文数</label><strong>372件</strong><span class="delta">↑ 9.3%</span></div><div class="kpi"><label>チケット販売数</label><strong>987枚</strong><span class="delta">↑ 15.2%</span></div><div class="kpi"><label>入場済み</label><strong>186 / 328</strong><span class="delta">56.7%</span></div></div><div class="admin-grid"><section class="admin-card"><div class="admin-card-head"><h3>売上推移</h3><span class="mini">売上 / 注文数</span></div>${chartHtml()}</section><section class="admin-card"><div class="admin-card-head"><h3>注文ステータス</h3><span class="mini">合計372件</span></div><div class="donut-wrap"><div class="donut"></div></div></section></div><section class="admin-card" style="margin-top:16px"><div class="admin-card-head"><div><h3>最近の注文</h3><span class="mini">直近の購入・返金状況</span></div><button class="btn btn-soft" style="min-height:38px" onclick="go('/admin/orders')">すべて見る</button></div>${orderTable()}</section></main></div></div>`}
function adminEvents(){const rows=[['SUMMER LIVE 2026','販売中','82%','328/400','2026/09/12'],['ROCK SPECIAL NIGHT','販売中','60%','120/200','2026/09/20'],['Acoustic Night','販売中','30%','30/100','2026/10/04'],['Jazz Night 2026','販売前','10%','10/100','2026/10/18']];return `<div class="admin-shell">${adminSide('events')}<div class="admin-main">${adminTop('イベント管理')}<main class="admin-content"><div class="admin-section-title"><div><h2>イベント</h2><div class="mini">公開・販売・開催状況を一元管理</div></div><button class="btn btn-primary" onclick="openCreateEvent()">＋ イベント作成</button></div><div class="toolbar"><input class="searchbox" placeholder="イベント名・会場で検索"><select class="selectbox"><option>ステータス：すべて</option><option>販売中</option><option>販売前</option><option>終了</option></select><select class="selectbox"><option>期間：すべて</option></select></div><section class="admin-card" style="padding:0;overflow:hidden"><div class="event-admin-row header"><div>イベント</div><div>ステータス</div><div>販売状況</div><div>開催日</div><div>操作</div></div>${rows.map((r,i)=>`<div class="event-admin-row"><div class="event-admin-name"><div class="thumb"></div><div><b>${r[0]}</b><div class="mini">${i?'STUDIO Z':'DIAMOND HALL'}</div></div></div><div><span class="status ${r[1]==='販売中'?'paid':'pending'}">${r[1]}</span></div><div><b>${r[3]}</b><div class="progress"><i style="width:${r[2]}"></i></div></div><div>${r[4]}</div><div><button class="table-actions" onclick="toast('${r[0]} を編集します')">•••</button></div></div>`).join('')}</section></main></div></div>`}
function adminOrders(){return `<div class="admin-shell">${adminSide('orders')}<div class="admin-main">${adminTop('注文・売上')}<main class="admin-content"><div class="admin-section-title"><div><h2>注文管理</h2><div class="mini">購入・決済・返金を検索して確認</div></div><button class="btn btn-soft">⇩ CSVエクスポート</button></div><div class="kpi-grid" style="margin-bottom:16px"><div class="kpi"><label>総注文</label><strong>372</strong></div><div class="kpi"><label>支払済み</label><strong>252</strong></div><div class="kpi"><label>支払い待ち</label><strong>78</strong></div><div class="kpi"><label>返金済み</label><strong>10</strong></div></div><div class="toolbar"><input class="searchbox" placeholder="注文ID・氏名・メールで検索"><select class="selectbox"><option>イベント：すべて</option></select><select class="selectbox"><option>状態：すべて</option><option>支払済み</option><option>支払い待ち</option><option>返金済み</option></select></div><section class="admin-card">${orderTable()}</section></main></div></div>`}
function adminCheckin(){return `<div class="admin-shell">${adminSide('checkin')}<div class="admin-main">${adminTop('入場管理')}<main class="admin-content"><div class="admin-section-title"><div><h2>本日の受付</h2><div class="mini">SUMMER LIVE 2026 · DIAMOND HALL</div></div><span class="chip chip-green">受付中</span></div><div class="kpi-grid" style="margin-bottom:16px"><div class="kpi"><label>販売済み</label><strong>328</strong></div><div class="kpi"><label>入場済み</label><strong id="checkCount">${state.checkedIn?'187':'186'}</strong></div><div class="kpi"><label>未入場</label><strong id="remainCount">${state.checkedIn?'141':'142'}</strong></div><div class="kpi"><label>入場率</label><strong id="rate">${state.checkedIn?'57.0':'56.7'}%</strong></div></div><div class="checkin-grid"><section class="scanner"><div class="scanner-title"><b>QRコードを枠内に合わせてください</b><div style="font-size:12px;color:#aeb2c2">カメラ受付モード</div></div><div class="scanner-ui"><button class="btn btn-primary" onclick="simulateScan()">テストQRを読み取る</button><button class="btn btn-soft" onclick="toast('氏名検索を開きました')">氏名で検索</button></div></section><aside class="admin-card"><div class="admin-card-head"><h3>読み取り結果</h3><span class="mini">リアルタイム</span></div><div class="checkin-result ${state.checkedIn?'success':''}" id="resultBox">${state.checkedIn?'<div><div class="big">✓</div><h3>受付完了</h3><b>山田 太郎</b><div class="mini">一般チケット · A-042</div></div>':'<div><div class="big">⌗</div><h3>待機中</h3><div class="mini">QRコードを読み取るとここに結果が表示されます</div></div>'}</div><div style="margin-top:14px"><b style="font-size:13px">最近の入場</b><div class="summary-line"><span>佐藤 花子</span><span class="chip chip-green">18:04</span></div><div class="summary-line"><span>鈴木 一郎</span><span class="chip chip-green">18:03</span></div><div class="summary-line"><span>高橋 健</span><span class="chip chip-green">18:02</span></div></div></aside></div></main></div></div>`}
function simulateScan(){if(state.checkedIn){toast('このチケットはすでに入場済みです');return}state.checkedIn=true;document.querySelector('#resultBox').className='checkin-result success';document.querySelector('#resultBox').innerHTML='<div><div class="big">✓</div><h3>受付完了</h3><b>山田 太郎</b><div class="mini">一般チケット · A-042</div></div>';document.querySelector('#checkCount').textContent='187';document.querySelector('#remainCount').textContent='141';document.querySelector('#rate').textContent='57.0%';toast('受付完了：A-042')}
function openCreateEvent(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><div class="modal"><span class="eyebrow">NEW EVENT</span><h2>新しいイベントを作成</h2><p class="section-sub">まず基本情報を入力します。下書きとして保存できます。</p><div class="field"><label>イベント名</label><input value="NEW LIVE EVENT 2026"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>開催日</label><input type="date" value="2026-10-24"></div><div class="field"><label>会場</label><input value="DIAMOND HALL"></div></div><div class="field"><label>公開状態</label><select><option>下書き</option><option>公開予約</option></select></div><div class="modal-actions"><button class="btn btn-soft" onclick="document.querySelector('#modal').remove()">キャンセル</button><button class="btn btn-primary" onclick="document.querySelector('#modal').remove();toast('下書きを保存しました')">下書きを保存</button></div></div></div>`) }
function render(){const r=route();let html;if(r==='/')html=home();else if(r.startsWith('/event/'))html=detail();else if(r==='/checkout')html=checkout();else if(r==='/tickets')html=tickets();else if(r==='/admin')html=adminDashboard();else if(r==='/admin/events')html=adminEvents();else if(r==='/admin/orders')html=adminOrders();else if(r==='/admin/checkin')html=adminCheckin();else html=home();document.querySelector('#app').innerHTML=html;window.scrollTo(0,0)}
window.addEventListener('hashchange',render);window.addEventListener('load',render);
</script>
