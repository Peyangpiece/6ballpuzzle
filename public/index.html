<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#060512">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>HEXDROP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%232FE3F5'/></svg>">
<style>
:root{color-scheme:dark}html,body,#root{margin:0;padding:0;height:100%;background:#060512;overscroll-behavior:none}body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;touch-action:manipulation;font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}#root{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}canvas{display:block;will-change:transform}#boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:24px;text-align:center;color:#2FE3F5;font-weight:800;letter-spacing:.25em;font-size:13px}#bootMsg{color:#ff8f9c;letter-spacing:0;font-weight:600;font-size:12px;max-width:520px;line-height:1.8;white-space:pre-wrap}.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#2FE3F5;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div><div id="boot"><div class="spin"></div><div>LOADING</div><div id="bootMsg"></div></div>
<script>var bootMsg=document.getElementById("bootMsg");function fail(m){if(bootMsg)bootMsg.textContent=m;}window.addEventListener("error",function(e){fail("エラー: "+(e&&e.message?e.message:e)+"\n"+(e.filename||""));});</script>
<script type="module">try{const a=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const u=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");const d=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");window.FB={initializeApp:a.initializeApp,getAuth:u.getAuth,signInAnonymously:u.signInAnonymously,onAuthStateChanged:u.onAuthStateChanged,getDatabase:d.getDatabase,ref:d.ref,set:d.set,get:d.get,update:d.update,remove:d.remove,push:d.push,onValue:d.onValue,off:d.off,runTransaction:d.runTransaction,onDisconnect:d.onDisconnect,serverTimestamp:d.serverTimestamp};}catch(e){console.warn("Firebase SDK load failed",e);}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script><script src="https://cdn.tailwindcss.com"></script>
<script src="app-01.js"></script><script src="app-02.js"></script><script src="app-03.js"></script><script src="app-04.js"></script><script src="app-05.js"></script><script src="app-06.js"></script><script src="app-07.js"></script><script src="app-08.js"></script><script src="app-09.js"></script><script src="ball-classic-data-0.js"></script><script src="app-10.js"></script><script src="app-14.js"></script><script src="app-15.js"></script><script src="app-16.js"></script><script src="app-17.js"></script><script src="patch-up-split.js"></script>
<script>(function(){try{if(typeof React==="undefined"||typeof ReactDOM==="undefined"){fail("Reactを読み込めませんでした");return;}window.__mountHexdrop();var b=document.getElementById("boot");if(b)b.remove();}catch(err){fail("起動時エラー: "+(err&&err.message?err.message:err));}})();</script>
</body></html>
