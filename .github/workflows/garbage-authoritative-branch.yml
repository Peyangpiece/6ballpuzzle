name: Garbage Authoritative Branch Gate

on:
  push:
    branches: [garbage-authoritative-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: garbage-authoritative-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  garbage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check garbage runtime syntax
        run: |
          set -e
          for f in \
            public/app-garbage-normal-physics.js \
            public/app-garbage-presentation.js \
            public/app-garbage-zero-rigidity.js \
            public/app-garbage-deep-settle.js \
            public/app-garbage-simultaneous-motion.js \
            public/app-garbage-render-overlap-guard.js \
            public/app-garbage-performance-v1.js \
            public/app-garbage-continuous-v1.js \
            public/app-garbage-freeze-authoritative-v1.js \
            public/app-garbage-min-displacement-crossing-v1.js \
            public/app-garbage-contact-monotonic-v1.js \
            public/app-garbage-rigid-row-contact-v1.js \
            public/app-garbage-deep-contact-hold-v1.js; do
            node --check "$f"
          done

      - name: Run current focused garbage regressions
        run: |
          set -e
          node tests/garbage-normal-physics.js
          node tests/garbage-presentation.js
          node tests/garbage-zero-rigidity.js
          node tests/garbage-diagonal-settle.js
          node tests/garbage-post-clear-collapse.js
          node tests/garbage-render-overlap-guard.js

      - name: Bisect production layers against garbage freeze
        run: node tests/garbage-production-layer-bisect.js

      - name: Trace first production overlap stage with contact finalizers
        run: |
          set -e
          cp tests/garbage-production-overlap-diagnostic.js tests/.garbage-row-diagnostic.tmp.js
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/.garbage-row-diagnostic.tmp.js')
          s=p.read_text()
          needle='"app-garbage-contact-monotonic-v1.js"\n];'
          repl='"app-garbage-contact-monotonic-v1.js",\n  "app-garbage-rigid-row-contact-v1.js",\n  "app-garbage-deep-contact-hold-v1.js"\n];'
          if needle not in s:
              raise SystemExit('diagnostic runtime tail not found')
          p.write_text(s.replace(needle,repl,1))
          PY
          node tests/.garbage-row-diagnostic.tmp.js
          rm tests/.garbage-row-diagnostic.tmp.js

      - name: Run production-load-order garbage integration with branch finalizers
        run: |
          set -e
          cp tests/garbage-production-integration.js tests/.garbage-row-integration.tmp.js
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/.garbage-row-integration.tmp.js')
          s=p.read_text()
          s=s.replace('"app-garbage-continuous-v1.js","app-contact-separation-v1.js",','"app-garbage-continuous-v1.js","app-contact-separation-v1.js","app-garbage-temporal-safety-v2.js",',1)
          needle='"app-garbage-freeze-authoritative-v1.js","app-garbage-min-displacement-crossing-v1.js"\n];'
          repl='"app-garbage-freeze-authoritative-v1.js","app-garbage-min-displacement-crossing-v1.js",\n  "app-garbage-contact-monotonic-v1.js","app-garbage-rigid-row-contact-v1.js","app-garbage-deep-contact-hold-v1.js"\n];'
          if needle not in s:
              raise SystemExit('integration runtime tail not found')
          s=s.replace(needle,repl,1)
          old='expect(Number.isFinite(q.v.x)&&Number.isFinite(q.v.y),label+": non-finite visual "+q.b.id);'
          new='if(!(Number.isFinite(q.v.x)&&Number.isFinite(q.v.y))){console.log("GARBAGE_NONFINITE_DIAGNOSTIC "+JSON.stringify({label,id:q.b.id,cell:[q.x,q.y],vis:{x:q.v.x,y:q.v.y,vx:q.v.vx,vy:q.v.vy,pileFlow:q.v.pileFlow,motionSpeed:q.v.motionSpeed},ball:{type:q.b.garbageType,seq:q.b.garbageSourceSeq,role:q.b.garbageSourceRole,path:q.b.fallPath},rigid:window.__sixBallLastGarbageRigidRowContactV1||null,deep:window.__sixBallLastGarbageDeepContactHoldV1||null,constraint:window.__sixBallLastGarbageConstraintSolve||null,minDisplacement:window.__sixBallLastGarbageMinDisplacementRepair||null}));throw new Error(label+": non-finite visual "+q.b.id);}'
          if old not in s:
              raise SystemExit('finite visual assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
          node tests/.garbage-row-integration.tmp.js
          rm tests/.garbage-row-integration.tmp.js
