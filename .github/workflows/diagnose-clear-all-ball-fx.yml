name: Diagnose every-cleared-ball disappearance FX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run every-cleared-ball disappearance FX regression
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          node tests/clear-all-ball-fx.js > audit-results/clear-all-ball-fx.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then status=pass; else status=fail; fi
          printf '{"sha":"%s","status":"%s","clearAllBallFx":%s}\n' "$GITHUB_SHA" "$status" "$code" > audit-results/clear-all-ball-fx.json
          cat audit-results/clear-all-ball-fx.log
          exit "$code"
      - name: Record every-cleared-ball FX audit
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/clear-all-ball-fx.json audit-results/clear-all-ball-fx.log
          git commit -m 'Record every-cleared-ball FX audit [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
