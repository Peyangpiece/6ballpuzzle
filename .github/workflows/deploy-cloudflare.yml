name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run physics regressions
        run: node tests/physics-regressions.js

      - name: Run precise CPU difficulty regression
        run: node tests/ai-technique-levels.js

      - name: Run Super Strong earliest-technique regression
        run: node tests/ai-fastest-technique.js

      - name: Run Super Strong technique-first speed-second regression
        run: node tests/ai-superstrong-speed-priority.js

      - name: Run Grandmaster Super Strong regression
        run: node tests/ai-grandmaster.js

      - name: Run runtime performance guards
        run: node tests/runtime-performance-guards.js

      - name: Run pile-flow tangency performance parity
        run: node tests/pileflow-tangency-performance.js

      - name: Run upward triangle split-side regression
        run: node tests/up-convex-split-side.js

      - name: Run parity direct-contact release regression
        run: node tests/release-parity-settle.js

      - name: Run wall-gap regression
        run: node tests/wall-gap-regression.js

      - name: Run landscape startup regression
        run: node tests/landscape-startup.js

      - name: Run immersive menu UI regression
        run: node tests/menu-ui-regression.js

      - name: Run every-cleared-ball disappearance FX regression
        run: node tests/clear-all-ball-fx.js

      - name: Run post-garbage clear-collapse regression
        run: node tests/garbage-post-clear-collapse.js

      - name: Run post-clear vacancy-priority regression
        run: node tests/clear-vacancy-priority.js

      - name: Run game-over garbage fade regression
        run: node tests/gameover-garbage-fade.js

      - name: Run garbage render overlap regression
        run: node tests/garbage-render-overlap-guard.js

      - name: Run airborne garbage pass-through regression
        run: node tests/garbage-airborne-pass-through.js

      - name: Run 100-pass movement fidelity
        run: node tests/run-movement-fidelity-100.js

      - name: Run 100-pass garbage fidelity
        run: node tests/run-garbage-fidelity-100.js

      - name: Run weighted 1000-pass reference fidelity
        run: node tests/run-reference-fidelity-1000.js

      - name: Run staged 3000-pass video convergence
        run: node tests/run-reference-convergence-3000.js

      - name: Run continuous no-overlap regression
        run: node tests/run-overlap-regressions.js

      - name: Stamp deploy commit
        run: printf '%s\n' "$GITHUB_SHA" > public/deploy-sha.txt

      - name: Deploy 6ballpuzzle
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: deploy

      - name: Verify Cloudflare production commit
        id: verify_production
        if: always()
        shell: bash
        env:
          WRANGLER_DEPLOYMENT_URL: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
          DEPLOY_OUTCOME: ${{ steps.cloudflare_deploy.outcome }}
          FALLBACK_PRODUCTION_URL: https://6ballpuzzle.hrk-6888.workers.dev
        run: |
          set +e
          mkdir -p audit-results
          PRODUCTION_URL="${WRANGLER_DEPLOYMENT_URL:-$FALLBACK_PRODUCTION_URL}"
          verified=0
          observed=""
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            for attempt in $(seq 1 20); do
              observed="$(curl -fsSL "${PRODUCTION_URL%/}/deploy-sha.txt?sha=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null | tr -d '\r\n' || true)"
              if [ "$observed" = "$GITHUB_SHA" ]; then
                verified=1
                break
              fi
              sleep 3
            done
          fi
          if [ "$verified" -eq 1 ]; then STATUS=pass; else STATUS=fail; fi
          printf '{"sha":"%s","status":"%s","deployOutcome":"%s","productionUrl":"%s","observedSha":"%s"}\n' "$GITHUB_SHA" "$STATUS" "$DEPLOY_OUTCOME" "$PRODUCTION_URL" "$observed" > audit-results/cloudflare-deploy.json
          rm -f public/deploy-sha.txt
          test "$STATUS" = pass

      - name: Record Cloudflare production verification
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.cloudflare_deploy.outcome }}
        run: |
          if [ ! -f audit-results/cloudflare-deploy.json ]; then
            mkdir -p audit-results
            printf '{"sha":"%s","status":"fail","deployOutcome":"%s","productionUrl":"%s","observedSha":""}\n' "$GITHUB_SHA" "$DEPLOY_OUTCOME" "https://6ballpuzzle.hrk-6888.workers.dev" > audit-results/cloudflare-deploy.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/cloudflare-deploy.json
          git commit -m 'Record Cloudflare production deploy [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require verified production deployment
        if: always()
        shell: bash
        run: |
          node -e 'const fs=require("fs");const q=JSON.parse(fs.readFileSync("audit-results/cloudflare-deploy.json","utf8"));if(q.status!=="pass")process.exit(1)'
