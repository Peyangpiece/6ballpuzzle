name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "wrangler.jsonc"
      - "tests/v1303-plan-group-smoke.js"
      - "tests/v1303-current-oracle-suite.js"
      - "tests/v1303-upconvex-production-guard.js"
      - "tests/v1303-upconvex-live-pocket-v24.js"
      - "tests/reference-20260826-upconvex-dynamic-split.js"
      - "tests/reference-20260826-rendered-pair-rigidity.js"
      - "tests/reference-20260826-solo-continuity-diagnostic.js"
      - "tests/reference-20260826-solo-pivot-arc.js"
      - "tests/reference-20260814-inverted-flat-split-diagnostic.js"
      - "tests/reference-rigidity-state-machine-v1.js"
      - "tests/reference-rigidity-release-bounce-v1.js"
      - "tests/motion-smoothness-regression-v1.js"
      - "tests/no-upward-bounce-split-continuity-v1.js"
      - "tests/clear-all-ball-fx.js"
      - "tests/oracles/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify committed assets
        shell: bash
        run: |
          set -euo pipefail
          test -s public/assets/menu-confirm-42.mp3
          grep -q 'app-rigidity-nintendo-authority-v1.js' public/index.html
          grep -q 'app-no-upward-bounce-split-authority-v1.js' public/index.html

      - name: Run current production gate
        id: production_gate
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          node tests/v1303-plan-group-smoke.js >/tmp/production-smoke.log 2>&1; A=$?
          node tests/v1303-current-oracle-suite.js >/tmp/production-oracle.log 2>&1; B=$?
          { node tests/v1303-upconvex-production-guard.js && node tests/v1303-upconvex-live-pocket-v24.js && node tests/reference-20260826-upconvex-dynamic-split.js && node tests/reference-20260826-rendered-pair-rigidity.js && node tests/reference-20260826-solo-continuity-diagnostic.js && node tests/reference-20260826-solo-pivot-arc.js; } >/tmp/production-upconvex.log 2>&1; C=$?
          node tests/clear-all-ball-fx.js >/tmp/production-clearfx.log 2>&1; D=$?
          node tests/reference-20260814-inverted-flat-split-diagnostic.js >/tmp/production-inverted-split.log 2>&1; E=$?
          node tests/reference-rigidity-state-machine-v1.js >/tmp/production-rigidity-state.log 2>&1; F=$?
          node tests/motion-smoothness-regression-v1.js >/tmp/production-smoothness.log 2>&1; G=$?
          node tests/no-upward-bounce-split-continuity-v1.js >/tmp/production-no-bounce-split.log 2>&1; H=$?
          if [ "$A" -eq 0 ] && [ "$B" -eq 0 ] && [ "$C" -eq 0 ] && [ "$D" -eq 0 ] && [ "$E" -eq 0 ] && [ "$F" -eq 0 ] && [ "$G" -eq 0 ] && [ "$H" -eq 0 ]; then STATUS=pass; else STATUS=fail; fi
          printf '{"sha":"%s","status":"%s","smoke":%s,"oracle12k":%s,"upconvex":%s,"clearFx":%s,"invertedSplit":%s,"rigidityState":%s,"smoothness":%s,"noBounceSplit":%s}\n' "$GITHUB_SHA" "$STATUS" "$A" "$B" "$C" "$D" "$E" "$F" "$G" "$H" > audit-results/deploy-gate.json
          for f in /tmp/production-*.log; do echo "===== $f ====="; tail -100 "$f"; done
          test "$STATUS" = pass

      - name: Record production gate
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if [ ! -f audit-results/deploy-gate.json ]; then
            mkdir -p audit-results
            printf '{"sha":"%s","status":"fail","smoke":99,"oracle12k":99,"upconvex":99,"clearFx":99,"invertedSplit":99,"rigidityState":99}\n' "$GITHUB_SHA" > audit-results/deploy-gate.json
          fi
          encoded="$(base64 -w0 audit-results/deploy-gate.json)"
          recorded=0
          for attempt in $(seq 1 6); do
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/audit-results/deploy-gate.json?ref=main" --jq '.sha' 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/audit-results/deploy-gate.json" -f message='Record deploy gate audit [skip ci]' -f content="$encoded" -f branch='main')
            if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
            if gh api "${args[@]}" >/dev/null 2>&1; then recorded=1; break; fi
            sleep 1
          done
          if [ "$recorded" -ne 1 ]; then echo "::warning::production gate audit record raced with another audit writer; deployment gate result remains authoritative"; fi

      - name: Stamp deploy commit
        if: ${{ steps.production_gate.outcome == 'success' }}
        run: printf '%s\n' "$GITHUB_SHA" > public/deploy-sha.txt

      - name: Deploy 6ballpuzzle
        if: ${{ steps.production_gate.outcome == 'success' }}
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: deploy

      - name: Verify Cloudflare production commit
        id: verify_production
        if: always()
        shell: bash
        env:
          WRANGLER_DEPLOYMENT_URL: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
          DEPLOY_OUTCOME: ${{ steps.cloudflare_deploy.outcome }}
          FALLBACK_PRODUCTION_URL: https://6ballpuzzle.hrk-6888.workers.dev
        run: |
          set +e
          mkdir -p audit-results
          PRODUCTION_URL="${WRANGLER_DEPLOYMENT_URL:-$FALLBACK_PRODUCTION_URL}"
          verified=0; observed=""
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            for attempt in $(seq 1 20); do
              observed="$(curl -fsSL "${PRODUCTION_URL%/}/deploy-sha.txt?sha=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null | tr -d '\r\n' || true)"
              if [ "$observed" = "$GITHUB_SHA" ]; then verified=1; break; fi
              sleep 3
            done
          fi
          if [ "$verified" -eq 1 ]; then STATUS=pass; else STATUS=fail; fi
          printf '{"sha":"%s","status":"%s","deployOutcome":"%s","productionUrl":"%s","observedSha":"%s"}\n' "$GITHUB_SHA" "$STATUS" "$DEPLOY_OUTCOME" "$PRODUCTION_URL" "$observed" > audit-results/cloudflare-deploy.json
          rm -f public/deploy-sha.txt
          test "$STATUS" = pass

      - name: Record Cloudflare production verification
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if [ ! -f audit-results/cloudflare-deploy.json ]; then
            mkdir -p audit-results
            printf '{"sha":"%s","status":"fail","deployOutcome":"unknown","productionUrl":"%s","observedSha":""}\n' "$GITHUB_SHA" "https://6ballpuzzle.hrk-6888.workers.dev" > audit-results/cloudflare-deploy.json
          fi
          encoded="$(base64 -w0 audit-results/cloudflare-deploy.json)"
          recorded=0
          for attempt in $(seq 1 6); do
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/audit-results/cloudflare-deploy.json?ref=main" --jq '.sha' 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/audit-results/cloudflare-deploy.json" -f message='Record Cloudflare production deploy [skip ci]' -f content="$encoded" -f branch='main')
            if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
            if gh api "${args[@]}" >/dev/null 2>&1; then recorded=1; break; fi
            sleep 1
          done
          if [ "$recorded" -ne 1 ]; then echo "::warning::Cloudflare audit record raced with another audit writer; verified production result remains authoritative"; fi

      - name: Require verified production deployment
        if: always()
        run: node -e 'const fs=require("fs");const q=JSON.parse(fs.readFileSync("audit-results/cloudflare-deploy.json","utf8"));if(q.status!=="pass")process.exit(1)'
