name: Deploy Live Gate Standalone

on:
  push:
    branches: [livegate-standalone]
    paths:
      - "livegate-preview/**"
      - "src/livegate-worker.js"
      - "wrangler.livegate.jsonc"
      - ".github/workflows/deploy-livegate-standalone.yml"
  workflow_dispatch:

concurrency:
  group: livegate-standalone-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Live Gate assets
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Live Gate" livegate-preview/index.html
          node --check livegate-preview/enhancements.js
          node --check livegate-preview/firebase-bridge.js
          node --check src/livegate-worker.js

      - name: Deploy separate Live Gate Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: deploy --config wrangler.livegate.jsonc

      - name: Verify separate production URL
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          FALLBACK_URL: https://live-gate-standalone.hrk-6888.workers.dev
        run: |
          set -euo pipefail
          URL="${DEPLOYMENT_URL:-$FALLBACK_URL}"
          echo "Production URL: $URL"
          for attempt in $(seq 1 20); do
            if curl -fsSL "$URL" | grep -q "Live Gate"; then
              echo "Verified: $URL"
              exit 0
            fi
            sleep 3
          done
          exit 1
