name: Patch Touch Engine Owner

on:
  push:
    branches: [main]
    paths:
      - 'tests/patch-touch-owner-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch touch owner selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/controls-v7.js');s=p.read_text()
          old='''    const player=()=>{\n        const list=window.__hexEnginesV7||[];\n        for(let i=list.length-1;i>=0;i--){\n            const g=list[i];\n            if(g&&g.state==="PLAYING"&&g.piece&&!g.ai)return g;\n        }\n        return null;\n    };'''
          new='''    const player=()=>{\n        const list=window.__hexEnginesV7||[];\n        for(let i=list.length-1;i>=0;i--){\n            const g=list[i];\n            // CPU boards and NET mirror boards never own local touch.  The\n            // newest remaining local-human engine is the current canvas owner\n            // even during READY; if it is not PLAYING yet, input is disabled\n            // instead of leaking into an older match still left in PLAYING.\n            if(!g||g.ai||g.state==="NET")continue;\n            return g.state==="PLAYING"&&g.piece?g:null;\n        }\n        return null;\n    };'''
          if old not in s:
              if new in s: raise SystemExit(0)
              raise SystemExit('player selection block not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check public/controls-v7.js
          node tests/touch-control-regression.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add public/controls-v7.js
          git diff --cached --quiet || git commit -m "Route touch only to current local match"
          git push
