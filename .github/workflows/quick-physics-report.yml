name: Quick Physics Report

on:
  push:
    branches: [main]
    paths:
      - 'tests/quick-regression-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run quick regression gates
        id: gate
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > audit-results/quick.log
          node tests/verify-known-bugs.js >> audit-results/quick.log 2>&1
          known=$?
          node tests/garbage-ball-interval-regression.js >> audit-results/quick.log 2>&1
          garbage=$?
          node tests/touch-control-regression.js >> audit-results/quick.log 2>&1
          touch=$?
          node tests/audit-attack-conservation.js >> audit-results/quick.log 2>&1
          attack=$?
          node tests/ball-conservation-fast.js >> audit-results/quick.log 2>&1
          conservation=$?
          node tests/landing-guide-smoke.js >> audit-results/quick.log 2>&1
          landing=$?
          printf '{"sha":"%s","knownBugs":%s,"garbageInterval":%s,"touch":%s,"attackConservation":%s,"ballConservation":%s,"landingSmoke":%s}\n' "$GITHUB_SHA" "$known" "$garbage" "$touch" "$attack" "$conservation" "$landing" > audit-results/quick.json
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "garbage=$garbage" >> "$GITHUB_OUTPUT"
          echo "touch=$touch" >> "$GITHUB_OUTPUT"
          echo "attack=$attack" >> "$GITHUB_OUTPUT"
          echo "conservation=$conservation" >> "$GITHUB_OUTPUT"
          echo "landing=$landing" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit quick report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add audit-results/quick.json audit-results/quick.log
          git diff --cached --quiet || git commit -m "Record quick physics report [skip ci]"
          git push
      - name: Enforce quick gates
        shell: bash
        run: |
          test "${{ steps.gate.outputs.known }}" = "0"
          test "${{ steps.gate.outputs.garbage }}" = "0"
          test "${{ steps.gate.outputs.touch }}" = "0"
          test "${{ steps.gate.outputs.attack }}" = "0"
          test "${{ steps.gate.outputs.conservation }}" = "0"
          test "${{ steps.gate.outputs.landing }}" = "0"
