name: Quick Physics Report

on:
  push:
    branches: [main]
    paths:
      - 'tests/quick-regression-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run targeted gate
        id: gate
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          node tests/verify-known-bugs.js > audit-results/quick.log 2>&1
          code=$?
          printf '{"sha":"%s","knownBugs":%s}\n' "$GITHUB_SHA" "$code" > audit-results/quick.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit quick report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add audit-results/quick.json audit-results/quick.log
          git diff --cached --quiet || git commit -m "Record quick physics report [skip ci]"
          git push
      - name: Enforce targeted gate
        run: test "${{ steps.gate.outputs.code }}" = "0"
