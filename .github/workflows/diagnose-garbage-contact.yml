# Final audit for the unified ordinary-ball garbage runtime.
name: Diagnose Garbage Contact

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: garbage-contact-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unified garbage and core physics audits
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > audit-results/garbage-contact.log

          node tests/garbage-normal-physics.js >> audit-results/garbage-contact.log 2>&1
          A=$?
          node tests/garbage-presentation.js >> audit-results/garbage-contact.log 2>&1
          B=$?
          node tests/pile-arc-motion.js >> audit-results/garbage-contact.log 2>&1
          C=$?
          node tests/ai-technique-levels.js >> audit-results/garbage-contact.log 2>&1
          D=$?
          node tests/garbage-zero-rigidity.js >> audit-results/garbage-contact.log 2>&1
          E=$?
          node tests/garbage-diagonal-settle.js >> audit-results/garbage-contact.log 2>&1
          F=$?
          node tests/garbage-chain-terrain2-diagnostic-v2.js >> audit-results/garbage-contact.log 2>&1
          node tests/garbage-chain-settle.js >> audit-results/garbage-contact.log 2>&1
          G=$?
          node tests/garbage-post-clear-collapse.js >> audit-results/garbage-contact.log 2>&1
          H=$?
          node tests/wall-gap-regression.js >> audit-results/garbage-contact.log 2>&1
          I=$?
          node tests/gameover-garbage-fade.js >> audit-results/garbage-contact.log 2>&1
          J=$?

          if [ "$A" -eq 0 ] && [ "$B" -eq 0 ] && [ "$C" -eq 0 ] && [ "$D" -eq 0 ] && [ "$E" -eq 0 ] && [ "$F" -eq 0 ] && [ "$G" -eq 0 ] && [ "$H" -eq 0 ] && [ "$I" -eq 0 ] && [ "$J" -eq 0 ]; then STATUS=pass; else STATUS=fail; fi
          printf '{"sha":"%s","status":"%s","garbageNormalPhysics":%s,"garbagePresentation":%s,"pileArc":%s,"aiTechnique":%s,"garbageZeroRigidity":%s,"garbageDiagonalSettle":%s,"garbageChainSettle":%s,"garbagePostClearCollapse":%s,"wallGapRegression":%s,"gameoverGarbageFade":%s}\n' \
            "$GITHUB_SHA" "$STATUS" "$A" "$B" "$C" "$D" "$E" "$F" "$G" "$H" "$I" "$J" > audit-results/garbage-contact.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/garbage-contact.log audit-results/garbage-contact.json
          git commit -m 'Record unified garbage audit [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main

          cat audit-results/garbage-contact.log
          test "$STATUS" = pass
