name: Diagnose Garbage Contact

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: garbage-contact-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unified garbage and core physics audits
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > audit-results/garbage-contact.log

          node tests/garbage-normal-physics.js >> audit-results/garbage-contact.log 2>&1
          A=$?
          node tests/pile-arc-motion.js >> audit-results/garbage-contact.log 2>&1
          B=$?
          node tests/ai-technique-levels.js >> audit-results/garbage-contact.log 2>&1
          C=$?

          if [ "$A" -eq 0 ] && [ "$B" -eq 0 ] && [ "$C" -eq 0 ]; then STATUS=pass; else STATUS=fail; fi
          printf '{"sha":"%s","status":"%s","garbageNormalPhysics":%s,"pileArc":%s,"aiTechnique":%s}\n' \
            "$GITHUB_SHA" "$STATUS" "$A" "$B" "$C" > audit-results/garbage-contact.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/garbage-contact.log audit-results/garbage-contact.json
          git commit -m 'Record unified garbage audit [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main

          cat audit-results/garbage-contact.log
          test "$STATUS" = pass
