name: Diagnose Garbage Contact

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose STRAIGHT individual contacts
        run: node tests/garbage-straight-contact-diagnostic.js
      - name: Diagnose active rotation overlap
        run: node tests/rotation-overlap-diagnostic.js
