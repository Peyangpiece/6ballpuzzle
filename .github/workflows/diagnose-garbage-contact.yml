name: Diagnose Garbage Contact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reference pile-contact and CPU audits
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > audit-results/garbage-contact.log

          node tests/garbage-airborne-pass-through.js >> audit-results/garbage-contact.log 2>&1
          A=$?
          node tests/garbage-airborne-rigidity.js >> audit-results/garbage-contact.log 2>&1
          B=$?
          node tests/garbage-gridified-motion-diagnostic.js >> audit-results/garbage-contact.log 2>&1
          C=$?
          node tests/garbage-overlap-frame-diagnostic.js >> audit-results/garbage-contact.log 2>&1
          D=$?
          node tests/garbage-settle-state.js >> audit-results/garbage-contact.log 2>&1
          E=$?
          node tests/ai-technique-levels.js >> audit-results/garbage-contact.log 2>&1
          F=$?

          if [ "$A" -eq 0 ] && [ "$B" -eq 0 ] && [ "$C" -eq 0 ] && [ "$D" -eq 0 ] && [ "$E" -eq 0 ] && [ "$F" -eq 0 ]; then STATUS=pass; else STATUS=fail; fi
          printf '{"sha":"%s","status":"%s","continuousContact":%s,"airborneRigidity":%s,"monotoneAfterContact":%s,"overlap":%s,"settleState":%s,"aiTechnique":%s}\n' \
            "$GITHUB_SHA" "$STATUS" "$A" "$B" "$C" "$D" "$E" "$F" > audit-results/garbage-contact.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/garbage-contact.log audit-results/garbage-contact.json
          git commit -m 'Record garbage pile-contact audit [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main

          cat audit-results/garbage-contact.log
          test "$STATUS" = pass
