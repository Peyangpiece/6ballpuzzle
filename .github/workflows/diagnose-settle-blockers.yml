name: Diagnose Settle Blockers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose rigid group versus settled garbage contact
        run: node tests/seed19-step1539-rigid-garbage-contact.js
