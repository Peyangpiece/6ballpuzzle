name: Validate and Deploy HEXDROP Current Runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hexdrop-main-pipeline
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in public/app-*.js public/controls-*.js; do
            node --check "$f"
          done

      - name: Check production shell and critical assets
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/manifest.webmanifest
          test -f wrangler.jsonc
          test -f public/controls-v7.js
          test -s public/assets/menu-confirm-42.mp3
          grep -q 'loadCurrentGameBuild' public/index.html
          grep -q 'app-rigidity-nintendo-authority-v1.js' public/index.html
          grep -q 'app-no-upward-bounce-split-authority-v1.js' public/index.html
          grep -q 'app-runtime-performance-v4.js' public/index.html
          grep -q 'app-collapse-vertical-merge-v1.js' public/index.html
          grep -q 'app-pile-motion-authority-v2.js' public/index.html
          grep -q 'controls-v7.js' public/index.html
          grep -q '__hexControlsV7Installed' public/controls-v7.js
          grep -q 'hexPhysNaturalMotion' public/app-02.js
          grep -q 'hexPhysPlanGroup' public/app-02.js
          grep -q 'hexPhysResolveEvent' public/app-03.js
          grep -q '__hexGarbageFinalizesIntoAccumulatedPile' public/app-garbage-normal-physics.js
          test ! -e public/app-simultaneous-collapse-v1.js
          test ! -e public/app-collapse-timing-authoritative-v2.js
          test ! -e public/app-pile-collapse-chunk-compression-v1.js
          test ! -e public/app-pile-motion-deadline-v1.js

      - name: Run current production smoke
        run: node tests/v1303-plan-group-smoke.js

      - name: Run runtime performance parity
        run: node tests/runtime-performance-v4-parity.js

      - name: Run authoritative 12000-case oracle
        run: node tests/v1303-current-oracle-suite.js

      - name: Run current up-convex production guards
        shell: bash
        run: |
          set -euo pipefail
          node tests/v1303-upconvex-production-guard.js
          node tests/v1303-upconvex-live-pocket-v24.js

      - name: Run current Nintendo motion regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/reference-20260826-upconvex-dynamic-split.js
          node tests/reference-20260826-rendered-pair-rigidity.js
          node tests/reference-20260826-solo-continuity-diagnostic.js
          node tests/reference-20260826-solo-pivot-arc.js
          node tests/reference-20260814-inverted-flat-split-diagnostic.js
          node tests/reference-rigidity-state-machine-v1.js
          node tests/reference-rigidity-release-bounce-v1.js
          node tests/motion-smoothness-regression-v1.js
          node tests/no-upward-bounce-split-continuity-v1.js
          node tests/even-row-strict-inner-split-continuity-v1.js

      - name: Check split motion state and frame-rate continuity
        shell: bash
        run: |
          set -euo pipefail
          node tests/split-visual-state-integrity.js
          for fps in 30 60 120 240; do
            TEST_FPS="$fps" node tests/no-upward-bounce-split-continuity-v1.js
            TEST_FPS="$fps" node tests/reference-video-motion.js
          done

      - name: Run clear disappearance FX regression
        run: node tests/clear-all-ball-fx.js

      - name: Run current unified garbage regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/garbage-normal-physics.js
          node tests/garbage-presentation.js
          node tests/pile-arc-motion.js
          node tests/garbage-zero-rigidity.js
          node tests/garbage-diagonal-settle.js
          node tests/garbage-chain-settle.js
          node tests/garbage-post-clear-collapse.js
          node tests/gameover-garbage-fade.js
          node tests/garbage-render-overlap-guard.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stamp deploy commit
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > public/deploy-sha.txt

      - name: Deploy 6ballpuzzle to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: deploy

      - name: Verify Cloudflare production commit
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          url="https://6ballpuzzle.hrk-6888.workers.dev/deploy-sha.txt"
          observed=""
          for attempt in $(seq 1 30); do
            observed="$(curl -fsS "${url}?run=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$observed" = "$expected" ]; then
              echo "Cloudflare production verified: $observed"
              exit 0
            fi
            sleep 2
          done
          echo "Expected: $expected"
          echo "Observed: $observed"
          exit 1
