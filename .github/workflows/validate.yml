name: Validate HEXDROP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in public/app-*.js public/controls-*.js; do
            node --check "$f"
          done
      - name: Check concatenated runtime syntax
        run: |
          cat \
            public/app-01.js public/app-02.js public/app-03.js public/app-04.js \
            public/app-05.js public/app-06.js public/app-07.js public/app-08.js \
            public/app-09.js public/app-10.js public/app-14.js public/app-15.js \
            public/app-16.js public/app-17.js public/controls-v5.js > /tmp/hexdrop-runtime.js
          node --check /tmp/hexdrop-runtime.js
      - name: Check floor parity regression
        run: |
          set -e
          cat > /tmp/floor-prefix.js <<'EOF'
          const React={useRef(){},useEffect(){},useState(){},useCallback(){}};
          const window={};
          const navigator={};
          EOF
          cat /tmp/floor-prefix.js public/app-01.js public/app-02.js public/app-04.js > /tmp/floor-test.js
          cat >> /tmp/floor-test.js <<'EOF'
          {
            const b=newBoard();
            const x=11, y=ROWS-2;
            const ball={id:1,c:0,momentumX:0,rollDir:0,subCellBias:0};
            b[y][x]=ball;
            const p=hexPhysNaturalMotion(b,x,y);
            if(!p) throw new Error('floor parity: missing move from row above floor');
            if(p.ty!==ROWS-1) throw new Error(`floor parity: expected ty=${ROWS-1}, got ${p.ty}`);
            if(p.kind!=='FLOOR_DROP') throw new Error(`floor parity: expected FLOOR_DROP, got ${p.kind}`);
          }
          {
            const b=newBoard();
            const x=11, y=ROWS-2;
            const ball={id:2,c:0,momentumX:1,rollDir:0,subCellBias:0};
            b[y][x]=ball;
            const p=hexPhysNaturalMotion(b,x,y);
            if(!p || p.tx!==x+1 || p.ty!==ROWS-1) throw new Error('floor parity: +X bias did not reach floor');
          }
          {
            const b=newBoard();
            const x=11, y=ROWS-2;
            const ball={id:3,c:0,momentumX:-1,rollDir:0,subCellBias:0};
            b[y][x]=ball;
            const p=hexPhysNaturalMotion(b,x,y);
            if(!p || p.tx!==x-1 || p.ty!==ROWS-1) throw new Error('floor parity: -X bias did not reach floor');
          }
          console.log('floor parity regression PASS');
          EOF
          node /tmp/floor-test.js
      - name: Check unified physics architecture
        run: |
          set -e
          test -f public/index.html
          test -f public/controls-v5.js
          test -f public/manifest.webmanifest
          test -f wrangler.jsonc
          grep -q 'hexPhysNaturalMotion' public/app-02.js
          grep -q 'hexPhysPlanGroup' public/app-02.js
          grep -q 'FLOOR_DROP' public/app-02.js
          grep -q 'y+1===ROWS-1' public/app-02.js
          grep -q 'hexPhysResolveEvent' public/app-03.js
          grep -q 'HEX_GARBAGE_SHAPE_INTERVAL=0.6' public/app-06.js
          grep -q 'prepareContinuousPileFlow' public/app-07.js
          grep -q 'Strict screen-down ray' public/controls-v5.js
          grep -q 'target.y+2' public/controls-v5.js
          grep -q 'controls-v5.js' public/index.html
          grep -q 'manifest.webmanifest' public/index.html
          grep -q -- '-webkit-touch-callout:none' public/index.html
          grep -q 'touch-action:none' public/index.html
          ! grep -q 'patch-' public/index.html
          ! test -e public/patch-up-split.js
          ! test -e public/patch-turn-gate-v2.js
          ! test -e public/patch-axis-pair-v3.js
          ! test -e public/patch-v4.js
          ! test -e public/patch-v6.js
          ! test -e public/patch-v7.js
          ! test -e public/patch-v8.js
          ! test -e public/patch-v9.js
          ! test -e public/patch-v10.js
