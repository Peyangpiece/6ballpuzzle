name: Validate and Deploy 6ball

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: 6ball-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Syntax-check every runtime script
        run: npm run check

      - name: Static defect scan of the concatenated runtime (ESLint no-undef)
        run: npm run lint

      - name: Precompiled Tailwind CSS is up to date
        shell: bash
        run: |
          set -euo pipefail
          npm run build:css
          git diff --exit-code -- public/tailwind.css || { echo "public/tailwind.css is stale: run 'npm run build:css' and commit"; exit 1; }

      - name: Production shell and loader invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/manifest.webmanifest
          test -f wrangler.jsonc
          grep -q '"directory": "./dist"' wrangler.jsonc
          grep -q 'loadCurrentGameBuild' public/index.html
          ! grep -q 'cdn.tailwindcss.com' public/index.html
          ! grep -q 'cdn.jsdelivr.net' public/index.html
          grep -q 'hexPhysNaturalMotion' public/app-02.js
          grep -q 'hexPhysPlanGroup' public/app-02.js
          grep -q 'hexPhysResolveEvent' public/app-03.js
          grep -q '__hexGarbageFinalizesIntoAccumulatedPile' public/app-garbage-normal-physics.js
          test ! -e public/assets/6ball-battle-bgm.mp3

      - name: Node regression gate (npm test)
        run: npm test
        env:
          TEST_WORKERS: '4'

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke on the production build
        run: npm run test:browser

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Realtime Database rules contract (emulator)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --legacy-peer-deps firebase-tools@14.19.0 @firebase/rules-unit-testing@4.0.1 firebase@11.10.0
          npx firebase emulators:exec --config firebase/firebase.json --only database --project demo-6ball "node tests/firebase-rules.js"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, rules]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: 6ball-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Stamp deploy commit
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > dist/deploy-sha.txt

      - name: Deploy 6ballpuzzle to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: deploy

      - name: Verify Cloudflare production commit
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          url="https://6ballpuzzle.hrk-6888.workers.dev/deploy-sha.txt"
          observed=""
          for attempt in $(seq 1 30); do
            observed="$(curl -fsS "${url}?run=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$observed" = "$expected" ]; then
              echo "Cloudflare production verified: $observed"
              exit 0
            fi
            sleep 2
          done
          echo "Expected: $expected"
          echo "Observed: $observed"
          exit 1
