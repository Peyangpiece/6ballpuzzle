name: Legacy Runtime Performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain archived diagnostic
        shell: bash
        run: |
          echo 'This legacy performance workflow depended on removed AI and pileflow runtime layers and an obsolete cached-shadow geometry assertion.'
          echo 'It is archived so stale failures cannot block or misrepresent the current V1303 production runtime.'
          echo 'A new performance harness should target the authoritative runtime files before this check is re-enabled on push.'
