name: Diagnose Current Production Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gate-diagnostic
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run current guarded production tests
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > audit-results/deploy-diagnostic.log

          node tests/v1303-plan-group-smoke.js >> audit-results/deploy-diagnostic.log 2>&1
          A=$?
          node tests/v1303-current-oracle-suite.js >> audit-results/deploy-diagnostic.log 2>&1
          B=$?
          {
            node tests/v1303-upconvex-production-guard.js &&
            node tests/v1303-upconvex-live-pocket-v24.js
          } >> audit-results/deploy-diagnostic.log 2>&1
          C=$?
          node tests/clear-all-ball-fx.js >> audit-results/deploy-diagnostic.log 2>&1
          D=$?

          if [ "$A" -eq 0 ] && [ "$B" -eq 0 ] && [ "$C" -eq 0 ] && [ "$D" -eq 0 ]; then STATUS=pass; else STATUS=fail; fi
          printf '{"sha":"%s","status":"%s","smoke":%s,"oracle12k":%s,"upconvex":%s,"clearFx":%s}\n' \
            "$GITHUB_SHA" "$STATUS" "$A" "$B" "$C" "$D" > audit-results/deploy-diagnostic.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/deploy-diagnostic.log audit-results/deploy-diagnostic.json
          git commit -m 'Record current production diagnostic [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main

          cat audit-results/deploy-diagnostic.log
          test "$STATUS" = pass
