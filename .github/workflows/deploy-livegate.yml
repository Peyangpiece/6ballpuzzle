name: Deploy Live Gate Standalone

on:
  push:
    branches: [livegate-standalone]
    paths:
      - "livegate-prod/**"
      - ".github/workflows/deploy-livegate.yml"
  workflow_dispatch:

concurrency:
  group: livegate-standalone-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: livegate-standalone

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Live Gate production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s livegate-prod/public/index.html
          test -s livegate-prod/public/firebase-config.js
          test -s livegate-prod/public/firebase-bridge.js
          test -s livegate-prod/public/app-1.js
          test -s livegate-prod/public/app-2.js
          test -s livegate-prod/public/app-3.js
          test -s livegate-prod/public/app-4.js
          test -s livegate-prod/public/styles-0.css
          test -s livegate-prod/public/styles-1.css
          test -s livegate-prod/public/styles-2.css
          cat livegate-prod/public/app-1.js livegate-prod/public/app-2.js livegate-prod/public/app-3.js livegate-prod/public/app-4.js > /tmp/livegate-app.js
          node --check /tmp/livegate-app.js
          node --check livegate-prod/public/firebase-bridge.js
          grep -q "Live Gate" livegate-prod/public/index.html
          grep -q "ballpuzzle-8cc87" livegate-prod/public/firebase-config.js
          grep -q "livegate-next/users" livegate-prod/public/firebase-bridge.js

      - name: Verify Firebase Auth and Realtime Database
        shell: bash
        env:
          FIREBASE_API_KEY: AIzaSyAanVETIredUVH1slS8OtIMSPdOn91u2HM
          FIREBASE_DB_URL: https://ballpuzzle-8cc87-default-rtdb.asia-southeast1.firebasedatabase.app
        run: |
          set -euo pipefail
          AUTH_JSON="$(curl -fsS -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data '{"returnSecureToken":true}')"
          ID_TOKEN="$(printf '%s' "$AUTH_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.idToken)process.exit(2);process.stdout.write(j.idToken)})')"
          FIREBASE_UID="$(printf '%s' "$AUTH_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.localId)process.exit(2);process.stdout.write(j.localId)})')"
          TEST_URL="${FIREBASE_DB_URL}/livegate-next/deploy-check/${FIREBASE_UID}.json?auth=${ID_TOKEN}"
          curl -fsS -X PUT "$TEST_URL" -H 'Content-Type: application/json' --data '{"ok":true,"source":"github-actions"}' > /tmp/firebase-write.json
          curl -fsS "$TEST_URL" | grep -q '"ok":true'
          curl -fsS -X DELETE "$TEST_URL" > /dev/null
          echo "Firebase anonymous auth and livegate-next database access verified."

      - name: Deploy standalone Live Gate Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          workingDirectory: "livegate-prod"
          command: deploy

      - name: Verify standalone deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          STABLE_URL: https://live-gate-next.hrk-6888.workers.dev
        run: |
          set -euo pipefail
          URL="${DEPLOYMENT_URL:-$STABLE_URL}"
          echo "Live Gate deployment URL: ${URL}"
          echo "Live Gate stable URL: ${STABLE_URL}"
          for attempt in $(seq 1 20); do
            if curl -fsSL "${URL%/}/" | grep -q "Live Gate" \
              && curl -fsSL "${URL%/}/firebase-config.js" | grep -q "ballpuzzle-8cc87" \
              && curl -fsSL "${URL%/}/app-4.js" | grep -q "adminCheckin" \
              && curl -fsSL "${STABLE_URL%/}/" | grep -q "Live Gate"; then
              echo "Live Gate deployment and stable domain verified."
              exit 0
            fi
            sleep 3
          done
          echo "Live Gate deployment verification failed."
          exit 1
