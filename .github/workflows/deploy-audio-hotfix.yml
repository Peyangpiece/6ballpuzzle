name: Deploy Audio Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-audio-hotfix.yml'
      - 'public/app-brand-bgm.js'
      - 'public/assets/menu-confirm-42.b64.00'
      - 'public/assets/menu-confirm-42.b64.01'
      - 'public/assets/menu-confirm-42.b64.02'
      - 'public/assets/menu-confirm-42.b64.tail'
      - 'tests/brand-bgm.js'
  workflow_dispatch:

concurrency:
  group: cloudflare-audio-hotfix
  cancel-in-progress: true

permissions:
  contents: write

# Audio-only deploy path. The menu tap sound is rebuilt from verified text chunks
# in-browser, while this workflow also reconstructs the exact MP3 for regression.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require completed full regression gate
        run: |
          node -e 'const fs=require("fs");const q=JSON.parse(fs.readFileSync("audit-results/deploy-gate.json","utf8"));const ks=["physics","airborne","movement100","garbage100","reference1000","convergence3000","overlap","clearVacancy"];if(q.status!=="pass"||ks.some(k=>q[k]!==0))process.exit(1)'

      - name: Reconstruct exact uploaded menu sound
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 tail; do
            tr -d '\r\n\t ' < "public/assets/menu-confirm-42.b64.${part}" > "/tmp/menu-confirm-42.${part}.b64"
          done
          {
            cat /tmp/menu-confirm-42.00.b64
            cat /tmp/menu-confirm-42.01.b64
            head -c 5376 /tmp/menu-confirm-42.02.b64
            for _ in 1 2 3 4 5; do head -c 5376 /tmp/menu-confirm-42.tail.b64; done
          } | base64 --decode > public/assets/menu-confirm-42.mp3
          echo '97f2bcc23284ca8403ae6d6d06dbf4d40a9f6a8ca877eabdd747a85b3e89047e  public/assets/menu-confirm-42.mp3' | sha256sum -c -
          test "$(stat -c%s public/assets/menu-confirm-42.mp3)" -eq 32256

      - name: Run audio UI regression
        run: node tests/brand-bgm.js

      - name: Stamp deploy commit
        run: printf '%s\n' "$GITHUB_SHA" > public/deploy-sha.txt

      - name: Deploy verified audio hotfix
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: deploy

      - name: Verify Cloudflare production commit
        id: verify_production
        if: always()
        shell: bash
        env:
          WRANGLER_DEPLOYMENT_URL: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
          DEPLOY_OUTCOME: ${{ steps.cloudflare_deploy.outcome }}
          FALLBACK_PRODUCTION_URL: https://6ballpuzzle.hrk-6888.workers.dev
        run: |
          set +e
          mkdir -p audit-results
          PRODUCTION_URL="${WRANGLER_DEPLOYMENT_URL:-$FALLBACK_PRODUCTION_URL}"
          verified=0
          observed=""
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            for attempt in $(seq 1 20); do
              observed="$(curl -fsSL "${PRODUCTION_URL%/}/deploy-sha.txt?sha=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null | tr -d '\r\n' || true)"
              if [ "$observed" = "$GITHUB_SHA" ]; then
                verified=1
                break
              fi
              sleep 3
            done
          fi
          if [ "$verified" -eq 1 ]; then STATUS=pass; else STATUS=fail; fi
          printf '{"sha":"%s","status":"%s","deployOutcome":"%s","productionUrl":"%s","observedSha":"%s","featureSha":"5770762746ec5306435d981ba83b1c9950df1562"}\n' "$GITHUB_SHA" "$STATUS" "$DEPLOY_OUTCOME" "$PRODUCTION_URL" "$observed" > audit-results/cloudflare-audio-hotfix.json
          rm -f public/deploy-sha.txt
          test "$STATUS" = pass

      - name: Record audio hotfix production verification
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.cloudflare_deploy.outcome }}
        run: |
          if [ ! -f audit-results/cloudflare-audio-hotfix.json ]; then
            mkdir -p audit-results
            printf '{"sha":"%s","status":"fail","deployOutcome":"%s","productionUrl":"%s","observedSha":"","featureSha":"5770762746ec5306435d981ba83b1c9950df1562"}\n' "$GITHUB_SHA" "$DEPLOY_OUTCOME" "https://6ballpuzzle.hrk-6888.workers.dev" > audit-results/cloudflare-audio-hotfix.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if node -e 'const fs=require("fs");const q=JSON.parse(fs.readFileSync("audit-results/cloudflare-audio-hotfix.json","utf8"));if(q.status!=="pass")process.exit(1)' 2>/dev/null; then
            git add public/assets/menu-confirm-42.mp3
          else
            git restore -- public/assets/menu-confirm-42.mp3 2>/dev/null || true
          fi
          git add audit-results/cloudflare-audio-hotfix.json
          git commit -m 'Record Cloudflare audio hotfix deploy [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require verified audio hotfix deployment
        if: always()
        run: node -e 'const fs=require("fs");const q=JSON.parse(fs.readFileSync("audit-results/cloudflare-audio-hotfix.json","utf8"));if(q.status!=="pass")process.exit(1)'
