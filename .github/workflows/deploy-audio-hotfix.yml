name: Restore Exact Menu Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-audio-hotfix.yml'
      - 'public/assets/menu-confirm-42.b64.00'
      - 'public/assets/menu-confirm-42.b64.01'
      - 'public/assets/menu-confirm-42.b64.02'
      - 'public/assets/menu-confirm-42.b64.tail'
  workflow_dispatch:

concurrency:
  group: restore-exact-menu-audio
  cancel-in-progress: true

permissions:
  contents: write

# Rebuild the exact user-uploaded menu confirmation sound from the verified
# text chunks. The resulting MP3 commit is then picked up by the normal guarded
# Cloudflare production deployment because it changes public/**.
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact uploaded menu sound
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 tail; do
            tr -d '\r\n\t ' < "public/assets/menu-confirm-42.b64.${part}" > "/tmp/menu-confirm-42.${part}.b64"
          done
          {
            cat /tmp/menu-confirm-42.00.b64
            cat /tmp/menu-confirm-42.01.b64
            head -c 5376 /tmp/menu-confirm-42.02.b64
            for _ in 1 2 3 4 5; do head -c 5376 /tmp/menu-confirm-42.tail.b64; done
          } | base64 --decode > public/assets/menu-confirm-42.mp3
          echo '97f2bcc23284ca8403ae6d6d06dbf4d40a9f6a8ca877eabdd747a85b3e89047e  public/assets/menu-confirm-42.mp3' | sha256sum -c -
          test "$(stat -c%s public/assets/menu-confirm-42.mp3)" -eq 32256

      - name: Commit exact menu sound
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- public/assets/menu-confirm-42.mp3; then
            echo 'Exact menu audio is already committed.'
            exit 0
          fi
          git add public/assets/menu-confirm-42.mp3
          git commit -m 'Restore exact menu confirmation audio'
          git pull --rebase origin main
          git push origin HEAD:main
