name: Diagnose landscape startup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run landscape startup regression
        id: landscape_startup
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          node tests/landscape-startup.js > audit-results/landscape-startup.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then status=pass; else status=fail; fi
          printf '{"sha":"%s","status":"%s","landscapeStartup":%s}\n' "$GITHUB_SHA" "$status" "$code" > audit-results/landscape-startup.json
          cat audit-results/landscape-startup.log
          exit "$code"
      - name: Record landscape startup audit
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/landscape-startup.json audit-results/landscape-startup.log
          git commit -m 'Record landscape startup audit [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
