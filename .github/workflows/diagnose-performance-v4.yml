name: Diagnose Runtime Performance V4

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: runtime-performance-v4-diagnostic
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run and record runtime performance tests
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > audit-results/performance-v4-diagnostic.log
          node tests/runtime-performance-guards.js >> audit-results/performance-v4-diagnostic.log 2>&1
          A=$?
          node tests/runtime-performance-v4-parity.js >> audit-results/performance-v4-diagnostic.log 2>&1
          B=$?
          if [ "$A" -eq 0 ] && [ "$B" -eq 0 ]; then STATUS=pass; else STATUS=fail; fi
          printf '{"sha":"%s","status":"%s","v2":%s,"v4":%s}\n' "$GITHUB_SHA" "$STATUS" "$A" "$B" > audit-results/performance-v4-diagnostic.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/performance-v4-diagnostic.log audit-results/performance-v4-diagnostic.json
          git commit -m 'Record runtime performance v4 diagnostic [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main

          cat audit-results/performance-v4-diagnostic.log
          test "$STATUS" = pass
