name: Diagnose Runtime Performance V4

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: runtime-performance-v4-diagnostic
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run runtime performance tests
        id: perf
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > audit-results/performance-v4-diagnostic.log
          node tests/runtime-performance-guards.js >> audit-results/performance-v4-diagnostic.log 2>&1
          A=$?
          node tests/runtime-performance-v4-parity.js >> audit-results/performance-v4-diagnostic.log 2>&1
          B=$?
          if [ "$A" -eq 0 ] && [ "$B" -eq 0 ]; then STATUS=pass; else STATUS=fail; fi
          printf '{"sha":"%s","status":"%s","v2":%s,"v4":%s}\n' "$GITHUB_SHA" "$STATUS" "$A" "$B" > audit-results/performance-v4-diagnostic.json
          cat audit-results/performance-v4-diagnostic.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record runtime performance diagnostic
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in performance-v4-diagnostic.log performance-v4-diagnostic.json; do
            path="audit-results/$file"
            encoded="$(base64 -w0 "$path")"
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='Record runtime performance v4 diagnostic [skip ci]' -f content="$encoded" -f branch='main')
            if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
            gh api "${args[@]}" >/dev/null
          done

      - name: Require runtime performance parity
        if: always()
        run: test "${{ steps.perf.outputs.status }}" = pass
