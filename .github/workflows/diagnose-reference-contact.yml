name: Diagnose Nintendo Reference Contact

on:
  push:
    branches: [main]
    paths:
      - "public/app-reference-upconvex-authority-v1.js"
      - "tests/reference-20260826-upconvex-dynamic-split.js"
      - ".github/workflows/diagnose-reference-contact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Nintendo-reference contact regression
        run: node tests/reference-20260826-upconvex-dynamic-split.js
