name: Deep Bug Audit

on:
  push:
    branches: [main]
    paths:
      - 'tests/deep-audit-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deep audits
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > audit-results/deep.log
          node tests/audit-ai-state.js 1 4 24 >> audit-results/deep.log 2>&1; ai=$?
          node tests/audit-performance.js 30 >> audit-results/deep.log 2>&1; perf=$?
          node tests/audit-settle-random.js 2000 >> audit-results/deep.log 2>&1; settle=$?
          node tests/audit-landing-guide.js 400 >> audit-results/deep.log 2>&1; landing=$?
          printf '{"sha":"%s","ai":%s,"performance":%s,"settle":%s,"landing":%s}\n' "$GITHUB_SHA" "$ai" "$perf" "$settle" "$landing" > audit-results/deep.json
          echo "ai=$ai" >> "$GITHUB_OUTPUT"
          echo "perf=$perf" >> "$GITHUB_OUTPUT"
          echo "settle=$settle" >> "$GITHUB_OUTPUT"
          echo "landing=$landing" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit deep report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add audit-results/deep.json audit-results/deep.log
          git diff --cached --quiet || git commit -m "Record deep bug audit [skip ci]"
          git push
      - name: Enforce deep audits
        shell: bash
        run: |
          test "${{ steps.audit.outputs.ai }}" = "0"
          test "${{ steps.audit.outputs.perf }}" = "0"
          test "${{ steps.audit.outputs.settle }}" = "0"
          test "${{ steps.audit.outputs.landing }}" = "0"
