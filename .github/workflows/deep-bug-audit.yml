name: Deep Bug Audit

on:
  push:
    branches: [main]
    paths:
      - 'tests/deep-audit-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deep audits
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > audit-results/deep.log
          node tests/audit-ai-state.js 1 2 12 >> audit-results/deep.log 2>&1; ai=$?
          node tests/audit-performance.js 16 >> audit-results/deep.log 2>&1; perf=$?
          node tests/audit-settle-random.js 500 >> audit-results/deep.log 2>&1; settle=$?
          node tests/audit-landing-guide.js 120 >> audit-results/deep.log 2>&1; landing=$?
          node tests/audit-rendered-guide.js 120 >> audit-results/deep.log 2>&1; rendered=$?
          node tests/audit-online-roundtrip.js >> audit-results/deep.log 2>&1; online=$?
          node tests/audit-online-rating.js >> audit-results/deep.log 2>&1; rating=$?
          node tests/audit-friend-room.js >> audit-results/deep.log 2>&1; friend=$?
          node tests/audit-attack-conservation.js >> audit-results/deep.log 2>&1; attack=$?
          printf '{"sha":"%s","ai":%s,"performance":%s,"settle":%s,"landing":%s,"renderedGuide":%s,"online":%s,"rating":%s,"friend":%s,"attack":%s}\n' "$GITHUB_SHA" "$ai" "$perf" "$settle" "$landing" "$rendered" "$online" "$rating" "$friend" "$attack" > audit-results/deep.json
          echo "ai=$ai" >> "$GITHUB_OUTPUT"
          echo "perf=$perf" >> "$GITHUB_OUTPUT"
          echo "settle=$settle" >> "$GITHUB_OUTPUT"
          echo "landing=$landing" >> "$GITHUB_OUTPUT"
          echo "rendered=$rendered" >> "$GITHUB_OUTPUT"
          echo "online=$online" >> "$GITHUB_OUTPUT"
          echo "rating=$rating" >> "$GITHUB_OUTPUT"
          echo "friend=$friend" >> "$GITHUB_OUTPUT"
          echo "attack=$attack" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit deep report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-results/deep.json audit-results/deep.log
          if ! git diff --cached --quiet; then git commit -m "Record deep bug audit [skip ci]"; fi
          git pull --rebase origin main
          git push
      - name: Enforce deep audits
        shell: bash
        run: |
          test "${{ steps.audit.outputs.ai }}" = "0"
          test "${{ steps.audit.outputs.perf }}" = "0"
          test "${{ steps.audit.outputs.settle }}" = "0"
          test "${{ steps.audit.outputs.landing }}" = "0"
          test "${{ steps.audit.outputs.rendered }}" = "0"
          test "${{ steps.audit.outputs.online }}" = "0"
          test "${{ steps.audit.outputs.rating }}" = "0"
          test "${{ steps.audit.outputs.friend }}" = "0"
          test "${{ steps.audit.outputs.attack }}" = "0"
