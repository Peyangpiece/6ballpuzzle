name: Diagnose Nintendo Motion Regressions

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nintendo-motion-regression-diagnostic
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Nintendo motion regressions individually
        id: diag
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > audit-results/nintendo-motion-diagnostic.log
          : > audit-results/nintendo-motion-diagnostic.tsv
          STATUS=pass
          tests=(
            reference-20260826-upconvex-dynamic-split.js
            reference-20260826-rendered-pair-rigidity.js
            reference-20260826-solo-continuity-diagnostic.js
            reference-20260826-solo-pivot-arc.js
            reference-20260814-inverted-flat-split-diagnostic.js
            reference-rigidity-state-machine-v1.js
            motion-smoothness-regression-v1.js
            no-upward-bounce-split-continuity-v1.js
            even-row-strict-inner-split-continuity-v1.js
          )
          for t in "${tests[@]}"; do
            echo "===== $t =====" >> audit-results/nintendo-motion-diagnostic.log
            node "tests/$t" >> audit-results/nintendo-motion-diagnostic.log 2>&1
            code=$?
            printf '%s\t%s\n' "$t" "$code" >> audit-results/nintendo-motion-diagnostic.tsv
            if [ "$code" -ne 0 ]; then STATUS=fail; fi
          done
          printf '{"sha":"%s","status":"%s"}\n' "$GITHUB_SHA" "$STATUS" > audit-results/nintendo-motion-diagnostic.json
          cat audit-results/nintendo-motion-diagnostic.tsv
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record Nintendo motion diagnostic
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in nintendo-motion-diagnostic.log nintendo-motion-diagnostic.tsv nintendo-motion-diagnostic.json; do
            path="audit-results/$file"
            encoded="$(base64 -w0 "$path")"
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='Record Nintendo motion diagnostic [skip ci]' -f content="$encoded" -f branch='main')
            if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
            gh api "${args[@]}" >/dev/null
          done

      - name: Require Nintendo motion regressions
        if: always()
        run: test "${{ steps.diag.outputs.status }}" = pass
