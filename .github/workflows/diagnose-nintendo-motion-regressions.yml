name: Diagnose Nintendo Motion Regressions

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nintendo-motion-regression-diagnostic
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Nintendo motion regressions individually
        id: diag
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          summary=audit-results/nintendo-motion-summary.txt
          log=audit-results/nintendo-motion-diagnostic.txt
          : > "$summary"
          : > "$log"
          STATUS=pass
          tests=(
            reference-20260826-upconvex-dynamic-split.js
            reference-20260826-rendered-pair-rigidity.js
            reference-20260826-solo-continuity-diagnostic.js
            reference-20260826-solo-pivot-arc.js
            reference-20260814-inverted-flat-split-diagnostic.js
            reference-rigidity-state-machine-v1.js
            motion-smoothness-regression-v1.js
            no-upward-bounce-split-continuity-v1.js
            even-row-strict-inner-split-continuity-v1.js
          )
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$summary"
          for t in "${tests[@]}"; do
            echo "===== $t =====" >> "$log"
            node "tests/$t" >> "$log" 2>&1
            code=$?
            printf '%s=%s\n' "$t" "$code" >> "$summary"
            if [ "$code" -ne 0 ]; then STATUS=fail; fi
          done
          printf 'STATUS=%s\n' "$STATUS" >> "$summary"
          cat "$summary"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record compact Nintendo summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='audit-results/nintendo-motion-summary.txt'
          encoded="$(base64 -w0 "$path")"
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='Record Nintendo motion summary [skip ci]' -f content="$encoded" -f branch='main')
            if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
            if gh api "${args[@]}" >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Require Nintendo motion regressions
        if: always()
        run: test "${{ steps.diag.outputs.status }}" = pass
